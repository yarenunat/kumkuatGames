<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kumkuat Games - Contact</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="overlay"></div>
    <div class="background-animation"></div>

    <header id="navbar">
        <div class="logo">
            <a href="index.html"><img src="./assets/images/kumkuat-logo.png" alt="Kumkuat Games Logo"></a>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="games.html">Games</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
        <a href="contact.html" class="btn-primary">Contact Us</a>
    </header>

    <div class="social-sidebar">
        <div class="line"></div>
        <a href="#"><i class="fa-brands fa-instagram"></i></a>
        <a href="#"><i class="fa-brands fa-twitter"></i></a>
        <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
        <div class="line"></div>
    </div>

    <!-- CONTACT SECTION -->
    <section class="contact-section page-section" style="padding-top: 12rem; min-height: 100vh;">
        <!-- New bottom section matching the visual -->
        <div class="contact-bg-img"></div>
        <div class="section-container" style="position: relative; z-index: 2;">
            <div class="contact-wrapper scroll-animate fade-right">
                <div class="contact-form-container glass-panel">
                    <h3>Want to join us,<br>but still have questions?</h3>
                    <p>Leave a request</p>
                    <form class="contact-form">
                        <input type="text" placeholder="Your name" required>
                        <input type="tel" placeholder="Phone number" required>
                        <textarea placeholder="Comment" rows="2"></textarea>
                        <button type="submit" class="btn-primary full-width">Send</button>
                    </form>
                </div>
                <div class="social-links-footer bottom-right-socials scroll-animate fade-left delay-2">
                    <a href="#"><i class="fa-brands fa-instagram"></i></a>
                    <a href="#"><i class="fa-brands fa-twitter"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-nav">
            <div class="logo">
                <img src="./assets/images/kumkuat-logo.png" alt="Kumkuat Games Logo" class="footer-logo">
            </div>
            <nav>
                <ul>
                    <li><a href="about.html">About</a></li>
                    <li><a href="games.html">Games</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="team.html">Team</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <a href="#" class="btn-primary sm-btn">Top <i class="fa-solid fa-arrow-up"></i></a>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2026 Kumkuat Games. All Rights Reserved.</p>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
